<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Reposeriff</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
    
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <i class="fa-solid fa-comments"></i>
                <h2>Reposeriff</h2>
            </div>
            <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>
            
            <form id="forgotForm">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" name="email" required placeholder="Email Address">
                </div>
                
                <button type="submit" class="login-btn" id="forgotBtn">
                    <span>Send Reset Link</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
            
            <div class="register-link">
                <p>Remember your password? <a href="index.html">Sign in</a></p>
            </div>
        </div>
    </div>
    <footer class="app-footer">
        <p>&copy; 2026 Reposeriff. All rights reserved.</p>
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>
    </footer>
    
    <script>
        document.getElementById('forgotForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Sending...</span>';
            btn.disabled = true;
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Sent!</span>';
                btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                setTimeout(() => window.location.href = 'index.html', 1500);
            }, 1500);
        });
    </script>
</body>
</html>
